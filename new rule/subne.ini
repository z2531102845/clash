; ============================================================
; Subconverter 远程配置文件（config.ini）
; 转换自：all-mihomo (Mihomo YAML)
; 说明：
; 1. 经检索确认，666OS/rules 仓库的 release 分支仅提供编译后的 .mrs / .srs 二进制文件，
;    不包含纯文本 .list/.txt 规则；本配置已将其全部替换为等价的 blackmatrix7/ios_rule_script
;    及 ACL4SSR 官方纯文本 .list 规则源。
; 2. 请先将配套的 base.yaml 托管到 GitHub/Gist/服务器，并替换下方 clash_rule_base 的链接。
; ============================================================

[custom]
; 引用配套的 base.yaml（包含端口、认证、TUN、Sniffer、Hosts、DNS 等全部基础配置）
; 请将下方链接替换为你自己托管的 base.yaml 直链：
clash_rule_base=https://raw.githubusercontent.com/z2531102845/clash/refs/heads/main/new%20rule/substore.yaml

; 启用规则生成并覆盖原规则
enable_rule_generator=true
overwrite_original_rules=true

; ==================== 自定义内联规则（严格保留原顺序） ====================
; 注：标准 Subconverter 不支持 Mihomo 专属的 AND 复合规则，已保留基础端口/域名/IP 规则；
; 若你使用的是支持 Meta 语法的 Subconverter 后端，可取消下方注释：
; ruleset=直接连接,[]AND,((NETWORK,UDP),(DST-PORT,23555-23558))
; ruleset=直接连接,[]AND,((NETWORK,UDP),(DST-PORT,3478))
; ruleset=REJECT,[]AND,((DOMAIN-SUFFIX,mzmcs.cc),(NETWORK,udp),(DST-PORT,443/8443))
; ruleset=REJECT,[]AND,((NETWORK,UDP),(DST-PORT,443),(NOT,((GEOSITE,cn))),(NOT,((GEOIP,CN))))

ruleset=节点选择,[]DOMAIN-KEYWORD,vakkerlight
ruleset=直接连接,[]DOMAIN,stun.parsec.app
ruleset=直接连接,[]DOMAIN-SUFFIX,m78.22280502.xyz
ruleset=直接连接,[]DOMAIN-SUFFIX,cloudflare-ech.com
ruleset=直接连接,[]DOMAIN-SUFFIX,api-huacloud.com
ruleset=直接连接,[]DOMAIN-SUFFIX,api.linkcube.dev
ruleset=直接连接,[]DOMAIN-SUFFIX,platform.suidau.com
ruleset=直接连接,[]DST-PORT,123
ruleset=直接连接,[]DST-PORT,9993
ruleset=直接连接,[]DOMAIN,api-flowercloud.com
ruleset=直接连接,[]DOMAIN,api.xmancdn.net
ruleset=直接连接,[]DOMAIN-KEYWORD,corenetcloud
ruleset=直接连接,[]DOMAIN-SUFFIX,xmancdn.net
ruleset=直接连接,[]DOMAIN-SUFFIX,wd-purple.com
ruleset=直接连接,[]DOMAIN-SUFFIX,wd-turbo.com
ruleset=直接连接,[]DOMAIN-SUFFIX,wd-gold.com
ruleset=直接连接,[]DOMAIN-SUFFIX,wd-gold.net
ruleset=直接连接,[]DOMAIN-SUFFIX,api-linkcube.com
ruleset=直接连接,[]DOMAIN-SUFFIX,admin.myshopline.com

; misaka 及特定网段
ruleset=直接连接,[]IP-CIDR,45.11.104.211/24,no-resolve
ruleset=直接连接,[]IP-CIDR,8.217.242.1/20,no-resolve
ruleset=直接连接,[]IP-CIDR,43.106.7.104/20,no-resolve
ruleset=节点选择,[]IP-CIDR,91.108.12.0/22,no-resolve
ruleset=节点选择,[]IP-CIDR,149.154.172.0/22,no-resolve

; ==================== 拦截规则 ====================
ruleset=REJECT,clash-classic:https://raw.githubusercontent.com/ignaciocastro/a-dove-is-dumb/refs/heads/main/clash.yaml
ruleset=REJECT,https://ruleset.skk.moe/Clash/non_ip/reject-drop.txt
ruleset=REJECT,https://ruleset.skk.moe/Clash/non_ip/reject-no-drop.txt
; 替代原 AdvertisingIP.mrs
